[project]
name = "limpiezadata-acatlan"
version = "0.1.0"
description = "Pipeline de datos: descarga, limpieza y dashboard"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "requests>=2.31.0",
    "streamlit>=1.35.0",
    "python-dotenv>=1.0.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]

# Esto arregla la advertencia (warning) de dev-dependencies
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
download = "src.downloader:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ESTO ARREGLA EL ERROR: Le dice a Python que tu código está en la carpeta "src"
[tool.hatch.build.targets.wheel]
packages = ["src"]
